<!-- MathJax 3 configuration: inline $...$ math and kramdown's math/tex script nodes.
     Must be loaded before the mathjax bundle below; both are deferred, so they run in
     document order. relative_url keeps this correct on the subsites, which have a baseurl. -->
<script type="text/javascript" defer
  src="{{ '/assets/js/mathjax-script-type.js' | relative_url }}">
</script>

<!-- Copied from https://docs.mathjax.org/en/latest/web/components/combined.html -->
<script type="text/javascript" id="MathJax-script" defer
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>
