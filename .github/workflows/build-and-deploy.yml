# Builds the static site from the GeoDMS wiki and deploys it to geodms.nl over FTPS.
#
# Triggers:
# - manual (Actions tab -> "Build and deploy geodms.nl" -> Run workflow), with an
#   optional dry-run that only builds; the site is then the artifact of the run
# - nightly schedule
# - repository_dispatch event "wiki-updated", sent by the ObjectVision/GeoDMS repo
#   when a wiki page changes (see extra/wiki-updated-trigger-for-GeoDMS-repo.yml)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    hostname of the webserver, e.g. ftp.example.nl
#   FTP_USERNAME  ftp account name
#   FTP_PASSWORD  ftp account password
# Optional repository variable:
#   FTP_SERVER_DIR  remote directory to deploy into, default "public_html/"
#
# The build runs on windows-latest because template/Gemfile.lock is pinned to the
# x64-mingw-ucrt platform. To move to ubuntu, first run
# `bundle lock --add-platform x86_64-linux` in template/ and commit the lockfile.
# The deploy only needs the built site, so it runs on ubuntu, which starts faster.

name: Build and deploy geodms.nl

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only: upload the site as an artifact, do not deploy"
        type: boolean
        default: false
      preview:
        description: "Deploy to geodms.nl/new/ instead of the live site (noindex, no sitemap)"
        type: boolean
        default: false
      indexnow_all:
        description: "Submit every page to IndexNow, not just recently changed ones"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC; for weekly use e.g. "17 3 * * 1" (Monday)
  repository_dispatch:
    types: [wiki-updated]

permissions:
  contents: read

# never run two deploys at the same time; queue instead
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

# where this run publishes, decided once for all the deploy attempts below.
# With preview, this publishes to geodms.nl/new/, which touches nothing else.
env:
  LOCAL_DIR: ${{ inputs.preview && '_out/new/' || '_out/' }}
  SERVER_DIR: ${{ inputs.preview && format('{0}new/', vars.FTP_SERVER_DIR || 'public_html/') || (vars.FTP_SERVER_DIR || 'public_html/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: template
          bundler-cache: true # bundle install + cache, driven by template/Gemfile.lock

      - name: Convert wikis to static html
        run: python convert_wiki_to_static_html.py ${{ inputs.preview && '--preview new' || '' }} ${{ inputs.indexnow_all && '--indexnow-all' || '' }}

      # The deploy attempts take the site from here, and with dry_run it is the result. It is
      # also what to upload by hand when every attempt was refused: unpack it into _out/ and
      # run deploy_local_winscp.ps1 -SkipBuild. Hidden files are included on purpose:
      # .well-known/security.txt is part of the site, and a file the deploy does not see is
      # a file it deletes from the server.
      - name: Keep the site for the deploy
        uses: actions/upload-artifact@v7
        with:
          name: geodms.nl-site
          path: _out/
          include-hidden-files: true
          retention-days: 7

      - name: Keep the IndexNow payload for after the deploy
        if: ${{ !inputs.dry_run && !inputs.preview }}
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-payload
          path: indexnow-payload.json
          retention-days: 1

  # The webserver refuses a deploy now and then: the ftp control connection times out on
  # port 21 before a single file is sent, while the same host answers from an office
  # connection. What the run history says about it, from early August to late September:
  # 25 of 60 runs were refused on their first attempt. Waiting on the same runner, for up
  # to three quarters of an hour, got one of those 25 through; a later run, on a fresh
  # runner, went through about half the time. That points at the runner's address rather
  # than at the moment, and not at the size of the upload either, since the refusal comes
  # before anything is sent.
  #
  # So every attempt is a job of its own, which gets a fresh runner and with it most likely
  # a different address. The waits in between are for the case where the host itself is
  # briefly down.
  #
  # A refused attempt records the runner's address and which ports of the host answered
  # from it, which is what the hosting party needs to find the block in their firewall.
  # If port 22 answers where 21 does not, sftp is a way around it; if nothing answers, the
  # block is on the whole address and only the hosting party can lift it.
  deploy-1:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAIT_SECONDS: 0
    outputs:
      done: ${{ steps.ftp.outcome == 'success' }}
    steps: &deploy-steps
      - name: Wait before trying again
        if: ${{ env.WAIT_SECONDS != '0' }}
        run: sleep "$WAIT_SECONDS"

      - uses: actions/download-artifact@v8
        with:
          name: geodms.nl-site
          path: _out/

      - name: Deploy to geodms.nl
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ${{ env.LOCAL_DIR }}
          server-dir: ${{ env.SERVER_DIR }}

      - name: Record what the webserver refused
        if: ${{ steps.ftp.outcome == 'failure' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          echo "This runner's address: $(curl -sS --max-time 10 https://api.ipify.org || echo unknown)"
          for port in 21 22 443; do
            if timeout 10 bash -c "exec 3<>/dev/tcp/$FTP_SERVER/$port" 2>/dev/null; then
              echo "port $port: answers"
            else
              echo "port $port: no answer"
            fi
          done
          echo "::warning::The webserver refused the deploy from this runner."

  deploy-2:
    needs: deploy-1
    if: ${{ needs.deploy-1.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAIT_SECONDS: 120
    outputs:
      done: ${{ steps.ftp.outcome == 'success' }}
    steps: *deploy-steps

  deploy-3:
    needs: deploy-2
    if: ${{ needs.deploy-2.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAIT_SECONDS: 600
    outputs:
      done: ${{ steps.ftp.outcome == 'success' }}
    steps: *deploy-steps

  deploy-4:
    needs: deploy-3
    if: ${{ needs.deploy-3.outputs.done != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAIT_SECONDS: 1800
    outputs:
      done: ${{ steps.ftp.outcome == 'success' }}
    steps: *deploy-steps

  # The attempts themselves never fail, so this decides how the run ends: it fails when
  # none of them got through. After one that did, it tells IndexNow about the changed
  # pages, so the urls are live before we announce them.
  announce:
    needs: [deploy-1, deploy-2, deploy-3, deploy-4]
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Say which attempt got through
        run: |
          if   [ "${{ needs.deploy-1.outputs.done }}" = "true" ]; then n=1
          elif [ "${{ needs.deploy-2.outputs.done }}" = "true" ]; then n=2
          elif [ "${{ needs.deploy-3.outputs.done }}" = "true" ]; then n=3
          elif [ "${{ needs.deploy-4.outputs.done }}" = "true" ]; then n=4
          else
            echo "::error::No deploy attempt got through, so geodms.nl still serves the previous build. The site is the artifact of this run: unpack it into _out/ and run deploy_local_winscp.ps1 -SkipBuild from a connection the host accepts."
            exit 1
          fi
          if [ "$n" != "1" ]; then
            echo "::warning::The webserver refused the earlier attempts; the deploy went through on attempt $n."
          fi

      # Tell Bing (and Yandex, Seznam, Naver) which pages changed. No account needed:
      # ownership is proven by the key file that was just deployed to the site root.
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.preview }}
        with:
          name: indexnow-payload

      - name: Notify IndexNow of changed pages
        if: ${{ !inputs.preview }}
        run: |
          count=$(jq '.urlList | length' indexnow-payload.json)
          if [ "$count" = "0" ]; then
            echo "No pages changed, nothing to submit."
            exit 0
          fi
          echo "Submitting $count url(s) to IndexNow."
          # IndexNow fetches the key file to verify ownership and answers 403 while it cannot
          # see it yet, which can happen right after a deploy. Hence the retries.
          for delay in 0 20 60; do
            [ "$delay" = "0" ] || { echo "Retrying in ${delay}s."; sleep "$delay"; }
            status=$(curl -sS -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json; charset=utf-8" \
              --data @indexnow-payload.json \
              -o response.txt -w "%{http_code}") || status="000"
            echo "HTTP $status"
            [ -s response.txt ] && cat response.txt
            case "$status" in
              200|202) echo "IndexNow accepted the submission."; exit 0 ;;
            esac
          done
          # a failed notification must not fail an otherwise good deploy
          echo "::warning::IndexNow submission did not succeed (last status $status); the sitemap still covers these pages."
