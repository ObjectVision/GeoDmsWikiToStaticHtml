# Builds the static site from the GeoDMS wiki and deploys it to geodms.nl over FTPS.
#
# Triggers:
# - manual (Actions tab -> "Build and deploy geodms.nl" -> Run workflow), with an
#   optional dry-run that uploads the site as an artifact instead of deploying
# - nightly schedule
# - repository_dispatch event "wiki-updated", sent by the ObjectVision/GeoDMS repo
#   when a wiki page changes (see extra/wiki-updated-trigger-for-GeoDMS-repo.yml)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    hostname of the webserver, e.g. ftp.example.nl
#   FTP_USERNAME  ftp account name
#   FTP_PASSWORD  ftp account password
# Optional repository variable:
#   FTP_SERVER_DIR  remote directory to deploy into, default "public_html/"
#
# The runner is windows-latest because template/Gemfile.lock is pinned to the
# x64-mingw-ucrt platform. To move to ubuntu, first run
# `bundle lock --add-platform x86_64-linux` in template/ and commit the lockfile.

name: Build and deploy geodms.nl

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only: upload the site as an artifact, do not deploy"
        type: boolean
        default: false
      preview:
        description: "Deploy to geodms.nl/new/ instead of the live site (noindex, no sitemap)"
        type: boolean
        default: false
      indexnow_all:
        description: "Submit every page to IndexNow, not just recently changed ones"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *" # nightly, 03:17 UTC; for weekly use e.g. "17 3 * * 1" (Monday)
  repository_dispatch:
    types: [wiki-updated]

permissions:
  contents: read

# never run two deploys at the same time; queue instead
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # one place to decide where this run publishes, so the deploy itself is a single step
      # that can be retried rather than two that both would have to be
      LOCAL_DIR: ${{ inputs.preview && '_out/new/' || '_out/' }}
      SERVER_DIR: ${{ inputs.preview && format('{0}new/', vars.FTP_SERVER_DIR || 'public_html/') || (vars.FTP_SERVER_DIR || 'public_html/') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: template
          bundler-cache: true # bundle install + cache, driven by template/Gemfile.lock

      - name: Convert wikis to static html
        run: python convert_wiki_to_static_html.py ${{ inputs.preview && '--preview new' || '' }} ${{ inputs.indexnow_all && '--indexnow-all' || '' }}

      - name: Upload site as artifact (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: geodms.nl-site
          path: _out/

      # The webserver refuses the connection outright now and then: the control socket times
      # out on port 21 while the same host answers from elsewhere, and a later run of exactly
      # the same job goes through. It follows large uploads, so it looks like the host rate
      # limits or blocks an address that opens a few thousand ftp connections in a row, which
      # is what an upload of five sites is. Until that is settled with the hosting party, the
      # deploy simply tries again after a wait. With preview, this publishes to
      # geodms.nl/new/, which touches nothing else on the server.
      - name: Deploy to geodms.nl (attempt 1)
        id: deploy1
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ${{ env.LOCAL_DIR }}
          server-dir: ${{ env.SERVER_DIR }}

      - name: Wait, then try again
        if: ${{ !inputs.dry_run && steps.deploy1.outcome == 'failure' }}
        shell: bash
        run: sleep 180

      - name: Deploy to geodms.nl (attempt 2)
        id: deploy2
        if: ${{ !inputs.dry_run && steps.deploy1.outcome == 'failure' }}
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ${{ env.LOCAL_DIR }}
          server-dir: ${{ env.SERVER_DIR }}

      - name: Wait longer, then try once more
        if: ${{ !inputs.dry_run && steps.deploy2.outcome == 'failure' }}
        shell: bash
        run: sleep 600

      - name: Deploy to geodms.nl (attempt 3)
        id: deploy3
        if: ${{ !inputs.dry_run && steps.deploy2.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ${{ env.LOCAL_DIR }}
          server-dir: ${{ env.SERVER_DIR }}

      - name: Say how many attempts it took
        if: ${{ success() && !inputs.dry_run && steps.deploy1.outcome == 'failure' }}
        shell: bash
        run: |
          if [ "${{ steps.deploy2.outcome }}" = "success" ]; then
            echo "::warning::The first deploy attempt was refused; the second went through."
          else
            echo "::warning::The first two deploy attempts were refused; the third went through."
          fi

      # Tell Bing (and Yandex, Seznam, Naver) which pages changed. No account needed:
      # ownership is proven by the key file that was just deployed to the site root.
      # Runs after the deploy on purpose, so the urls are live before we announce them.
      # success() is spelled out: a failed deploy must not announce urls that were never
      # published, and an explicit condition is easier to trust than an implicit one
      - name: Notify IndexNow of changed pages
        if: ${{ success() && !inputs.dry_run && !inputs.preview }}
        shell: bash
        run: |
          count=$(python -c "import json; print(len(json.load(open('indexnow-payload.json'))['urlList']))")
          if [ "$count" = "0" ]; then
            echo "No pages changed, nothing to submit."
            exit 0
          fi
          echo "Submitting $count url(s) to IndexNow."
          # The key file is uploaded by the deploy step just above; IndexNow fetches it to
          # verify ownership and answers 403 while it cannot see it yet. Hence the retries.
          for delay in 0 20 60; do
            [ "$delay" = "0" ] || { echo "Retrying in ${delay}s."; sleep "$delay"; }
            status=$(curl -sS -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json; charset=utf-8" \
              --data @indexnow-payload.json \
              -o response.txt -w "%{http_code}") || status="000"
            echo "HTTP $status"
            [ -s response.txt ] && cat response.txt
            case "$status" in
              200|202) echo "IndexNow accepted the submission."; exit 0 ;;
            esac
          done
          # a failed notification must not fail an otherwise good deploy
          echo "::warning::IndexNow submission did not succeed (last status $status); the sitemap still covers these pages."
